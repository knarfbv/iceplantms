<aside id="sidebar"
    class="fixed lg:static inset-y-0 left-0 z-40
           w-64 bg-arctic-900 text-frost-100 flex flex-col shrink-0
           -translate-x-full lg:translate-x-0
           transition-transform duration-200 ease-in-out
           lg:pt-0 pt-14">

    <div class="hidden lg:block px-6 py-5 border-b border-arctic-700">
        <h1 class="text-lg font-bold text-ice-300">IcePlant MS</h1>
        <p class="text-xs text-frost-500 mt-0.5">Management System</p>
    </div>

    <nav class="flex-1 px-4 py-6 space-y-1">
        <a href="{% url 'dashboard' %}"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-frost-300 hover:bg-arctic-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-ice-400 transition-colors duration-150">
            <span class="text-lg shrink-0">🏠</span>
            Dashboard
        </a>
        <a href="{% url 'inventory_list' %}"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-frost-300 hover:bg-arctic-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-ice-400 transition-colors duration-150">
            <span class="text-lg shrink-0">📦</span>
            Inventory
        </a>
        <a href="{% url 'customer_list' %}"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-frost-300 hover:bg-arctic-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-ice-400 transition-colors duration-150">
            <span class="text-lg shrink-0">👤</span>
            Customers
        </a>
        <a href="{% url 'order_list' %}"
           class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-frost-300 hover:bg-arctic-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-ice-400 transition-colors duration-150">
            <span class="text-lg shrink-0">🧾</span>
            Orders
        </a>
    </nav>

    <div class="px-4 py-4 border-t border-arctic-700">
        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit"
                class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-frost-400 hover:bg-arctic-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-ice-400 transition-colors duration-150">
                <span class="text-lg shrink-0">🚪</span>
                Sign out
            </button>
        </form>
    </div>
</aside>
