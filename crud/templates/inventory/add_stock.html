{% extends 'layout/base.html' %}

{% block 'title' %}Add Stock{% endblock %}

{% block 'content' %}
<div class="max-w-md">
    <h2 class="text-2xl font-semibold text-arctic-800 mb-6">Add Stock</h2>

    <div class="bg-white rounded-xl border border-frost-200 p-6">
        <p class="text-sm text-frost-600 mb-4">
            <span class="font-semibold text-arctic-800">{{ item.name }}</span>
        </p>
        <p class="text-sm text-frost-600 mb-4">
            Current stock: <span class="font-semibold text-arctic-800">{{ item.quantity }}</span>
        </p>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-frost-700 mb-1">Quantity to Add</label>
                <input type="number" name="quantity" min="1" value="1" required
                       class="w-full text-sm border border-frost-200 rounded-lg px-3 py-2 text-frost-700 focus:ring-2 focus:ring-ice-500 focus:border-transparent">
            </div>
            <div class="flex gap-3 pt-2">
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white text-sm px-5 py-2 rounded-lg transition">
                    Add Stock
                </button>
                <a href="{% url 'inventory_list' %}" class="text-sm text-frost-500 hover:text-frost-700 px-5 py-2 transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
