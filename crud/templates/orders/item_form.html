{% extends 'layout/base.html' %}

{% block 'title' %}Add Item{% endblock %}

{% block 'content' %}
<div class="max-w-lg">
    <h2 class="text-2xl font-semibold text-arctic-800 mb-6">Add Item to Order #{{ order.pk }}</h2>

    <div class="bg-white rounded-xl border border-frost-200 p-6">
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-sm font-medium text-frost-700 mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <p class="text-red-400 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}
            <div class="flex gap-3 pt-2">
                <button type="submit" class="bg-ice-500 hover:bg-ice-600 text-white text-sm px-5 py-2 rounded-lg transition">
                    Add Item
                </button>
                <a href="{% url 'order_detail' order.pk %}" class="text-sm text-frost-500 hover:text-frost-700 px-5 py-2 transition">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
